<style>
:root {
--bg:#FBF7F2;--card:#FFFBF7;--border:#E8DDD4;--accent:#C49B7C;--accent2:#A67B5B;
--text:#3D322B;--muted:#8B7D74;--green:#7DA37D;--red:#C47B7B;--amber:#C49B5B;--blue:#7B9EC4;
--radius:18px;
font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-size:14px;padding:20px;max-width:1100px;margin:0 auto;line-height:1.5}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding:0 4px;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:24px;font-weight:700}
.conn-row{display:flex;gap:10px;flex-wrap:wrap}
.conn-pip{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);background:var(--card);padding:4px 8px;border-radius:12px;border:1px solid var(--border)}
.conn-pip .d{width:6px;height:6px;border-radius:50%}
.conn-pip .d.on{background:var(--green)} .conn-pip .d.off{background:var(--red)}
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.hc{background:var(--card);border-radius:var(--radius);padding:16px 14px;text-align:center;border:1px solid var(--border);cursor:pointer;transition:transform .12s}
.hc:hover{transform:translateY(-2px)}
.hc .val{font-size:24px;font-weight:700;letter-spacing:-1px}
.hc .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.sc{background:var(--card);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border)}
.sc h3{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.mi{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.mi:last-child{border:0}
.mi .del{cursor:pointer;color:var(--red);opacity:.5;font-size:16px;padding:0 4px;transition:opacity .15s}
.mi .del:hover{opacity:1}
.mi .tag{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--accent);color:#fff}
.map-grid{display:flex;flex-wrap:wrap;gap:5px}
.map-chip{font-size:10px;background:var(--card);padding:4px 7px;border-radius:5px;border:1px solid var(--border)}
.panel-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(61,50,43,.18);z-index:99;display:none}
.panel-overlay.show{display:block}
.panel{position:fixed;top:0;right:0;width:440px;max-width:92vw;height:100%;background:rgba(251,247,242,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:-2px 0 30px rgba(0,0,0,.1);z-index:100;padding:28px 24px;overflow-y:auto;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1)}
.panel.show{transform:translateX(0)}
.panel h2{font-size:20px;font-weight:600;margin-bottom:16px}
.panel .close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--border);border:0;cursor:pointer;font-size:15px}
.pi{padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between;align-items:center}
.pi:last-child{border:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
@media(max-width:680px){.hero{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:420px){.hero{grid-template-columns:1fr}}
</style>
</head>

async function del(type,idx){
  if(!confirm('确认删除？'))return;
  try{let r=await fetch(API+'/'+type+'/'+idx,{method:'DELETE'});let j=await r.json();
  if(j.ok){T('✅ 已删除');setTimeout(()=>location.reload(),800)}
  else T('❌ '+j.error)}catch(e){T('⚠️ API未连接，请运行 api_server.py')}
}
