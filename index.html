<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hermes 工作台</title>
<style>
:root{--bg:#FBF7F2;--card:#FFFBF7;--border:#E8DDD4;--accent:#C49B7C;--accent2:#A67B5B;--text:#3D322B;--muted:#8B7D74;--green:#7DA37D;--red:#C47B7B;--amber:#C49B5B;--blue:#7B9EC4;--radius:18px;font-family:-apple-system,system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-size:14px;padding:20px;max-width:1100px;margin:0 auto;line-height:1.5}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:24px;font-weight:700}
.pips{display:flex;gap:8px;flex-wrap:wrap}
.pip{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);background:var(--card);padding:4px 8px;border-radius:12px;border:1px solid var(--border)}
.pip .d{width:6px;height:6px;border-radius:50%}.pip .on{background:var(--green)}.pip .off{background:var(--red)}
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.hc{background:var(--card);border-radius:var(--radius);padding:16px 14px;text-align:center;border:1px solid var(--border);cursor:pointer;transition:transform .12s}
.hc:hover{transform:translateY(-2px)}.hc .val{font-size:22px;font-weight:700}.hc .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.sc{background:var(--card);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border);margin-bottom:10px}
.sc h3{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.mi{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px}.mi:last-child{border:0}
.mi .tag{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--accent);color:#fff}
.map{display:flex;flex-wrap:wrap;gap:5px}.map-chip{font-size:10px;background:var(--card);padding:4px 7px;border-radius:5px;border:1px solid var(--border)}
.panel-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(61,50,43,.18);z-index:99;display:none}
.panel-overlay.show{display:block}
.panel{position:fixed;top:0;right:0;width:440px;max-width:92vw;height:100%;background:rgba(251,247,242,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:-2px 0 30px rgba(0,0,0,.1);z-index:100;padding:28px 24px;overflow-y:auto;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1)}
.panel.show{transform:translateX(0)}.panel h2{font-size:20px;font-weight:600;margin-bottom:16px}
.panel .close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--border);border:0;cursor:pointer;font-size:15px}
.pi{padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between}.pi:last-child{border:0}
@media(max-width:680px){.hero{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="panel-overlay" id="ov"></div>
<div class="panel" id="pn"><button class="close" id="cl">✕</button><div id="pc"></div></div>
<script>
fetch('data.json').then(r=>r.json()).then(D=>{
// Populate pips
document.getElementById('pips').innerHTML = D.connections.map(c=>`<div class="conn-pip">${c.icon} ${c.name}<span class="d ${c.ok?'on':'off'}"></span></div>`).join('');

let crOk=D.cron.ok, crT=D.cron.total, crPct=Math.round(crOk/crT*100);
let rdPct=D.reading.read?D.reading.read.length?Math.round(D.reading.read.length/D.reading.total*100):0:0;

function ring(pct,color){return`<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--border)" stroke-width="3"/><circle cx="18" cy="18" r="15.5" fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="${pct},100" stroke-linecap="round" transform="rotate(-90 18 18)"/></svg>`}

let topbarHTML = `<div class="topbar"><h1>⚡ Hermes 工作台</h1><div class="pips">`+D.connections.map(c=>`<div class="conn-pip">${c.icon} ${c.name}<span class="d ${c.ok?'on':'off'}"></span></div>`).join('')+`</div></div>`;

let heroHTML=`
<div class="hero">
<div class="hc" onclick="P('cron')"><div class="val">${crOk}/${crT}</div><div class="lbl">任务 ${crPct}%</div></div>
<div class="hc" onclick="P('reading')"><div class="val">${D.reading.total}</div><div class="lbl">伴读</div></div>
<div class="hc" onclick="P('skills')"><div class="val">${D.skills.length}</div><div class="lbl">Skills</div></div>
<div class="hc" onclick="P('health')"><div class="val">${D.health.score||'?'}</div><div class="lbl">健康分</div></div>
</div>`;

let sections=`
<div class="grid2">
<div class="sc"><h3>伴读 · ${D.reading.total}条</h3>${D.reading.recent.map((i,n)=>`<div class="mi"><span>${i.rating?'⭐'.repeat(i.rating):'📌'} ${i.title}</span></div>`).join('')||'<div class="mi">暂无</div>'}</div>
<div class="sc"><h3>⏰ 任务</h3>${D.cron.jobs.filter(j=>j.last_status==='error').slice(0,3).map(j=>`<div class="mi">🔴 ${j.name||j.id}</div>`).join('')||'<div class="mi" style="color:var(--green)">🟢 全部正常</div>'}</div>
<div class="sc"><h3>💡 灵感 · ${D.ideas.total}条</h3>${D.ideas.recent.map(i=>`<div class="mi"><span>[${i.tag}] ${(i.idea||'').substring(0,35)}</span></div>`).join('')||'<div class="mi">暂无</div>'}</div>
<div class="sc"><h3>🩺 健康</h3><div class="mi"><span>😴 睡眠</span><span>${D.health.sleep||'?'}</span></div><div class="mi"><span>❤️ 静息心率</span><span>${D.health.resting_hr||'?'}</span></div><div class="mi"><span>⚖️ 体重</span><span>${D.health.weight||'?'}</span></div></div>
</div>
<div class="sc"><h3>💬 对话记忆</h3>${(D.dialogue.extracted||[]).slice(0,4).map(e=>`<div class="mi"><span>${e.type==='todo'?'📌':e.type==='idea'?'💡':'🔧'} ${(e.from||'').substring(0,60)}</span></div>`).join('')||'<div class="mi">暂无</div>'}</div>
<div class="sc"><h3>🔗 数据连线</h3><div class="map-grid">${D.connection_map.map(c=>`<div class="map-chip">${c.icon} ${c.from} → ${c.to}</div>`).join('')}</div></div>
<div class="grid2">
<div class="sc"><h3>📁 Obsidian</h3>${D.obsidian.map(f=>`<div class="mi" style="cursor:pointer" onclick="PO('${f.name}')"><span>${f.icon} ${f.name}</span><span style="color:var(--muted)">${f.count}篇</span></div>`).join('')}</div>
<div class="sc"><h3>🧹 断舍离</h3>${(D.declutter.pending||[]).map(i=>`<div class="mi"><span>📋 ${i.name||'?'}</span></div>`).join('')}${(D.declutter.done_recent||[]).map(i=>`<div class="mi"><span>✅ ${i.name||'?'}</span></div>`).join('')||'<div class="mi">暂无</div>'}</div>
</div>
<div class="grid2">
<div class="sc"><h3>🤖 Codex</h3>${D.codex.map(p=>`<div class="mi"><span>${p.name}</span><span style="font-size:10px;color:var(--muted)">${p.file_count}文件</span></div>`).join('')||'<div class="mi">暂无</div>'}</div>
<div class="sc"><h3>💰 财富管理</h3><div class="mi"><span>🏦 总资产</span><span>${D.finance?.assets||'?'}</span></div><div class="mi"><span>💵 月收入</span><span>${D.finance?.income||'?'}</span></div><div class="mi"><span>💸 月支出</span><span>${D.finance?.expense||'?'}</span></div><div class="mi"><span>📈 月结余</span><span style="color:var(--green)">${D.finance?.savings||'?'}</span></div></div>
</div>`;

let pageHTML = topbarHTML + heroHTML + sections;
let target = document.querySelector('.panel-overlay');
let wrapper = document.createElement('div');
wrapper.innerHTML = pageHTML;
document.body.insertBefore(wrapper, target);

// Panel functions
window.P = function(type){
 let t='',items=[];
 if(type==='reading'){t='伴读 · '+D.reading.total+'条';D.reading.recent.forEach(i=>items.push({l:(i.rating?'⭐'.repeat(i.rating):'📌')+' '+i.title,r:''}));}
 else if(type==='cron'){t='⏰ 任务';items=D.cron.jobs.map(j=>({l:(j.last_status==='error'?'🔴':'🟢')+' '+j.name,r:j.schedule||''}));}
 else if(type==='skills'){t='🧩 Skills';items=D.skills.map(s=>({l:s.name,r:s.desc?.substring(0,50)||''}));}
 else if(type==='health'){t='🩺 健康';items=[{l:'😴 睡眠',r:D.health.sleep},{l:'❤️ 静息心率',r:D.health.resting_hr},{l:'⚖️ 体重',r:D.health.weight}];}
 document.getElementById('pc').innerHTML='<h2>'+t+'</h2>'+items.map(i=>`<div class="pi">${i.l}<span>${i.r||''}</span></div>`).join('');
 document.getElementById('pn').classList.add('show');document.getElementById('ov').classList.add('show');
};
window.PO = function(n){let f=D.obsidian.find(o=>o.name===n);if(!f)return;document.getElementById('pc').innerHTML='<h2>📁 '+f.icon+' '+n+'</h2>'+f.items.map(i=>`<div class="pi">${i.title.substring(0,60)}</div>`).join('');document.getElementById('pn').classList.add('show');document.getElementById('ov').classList.add('show');}
}).catch(()=>{document.body.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted)">⚠️ 无法加载 data.json<br>请运行 python3 api_server.py</div>'+document.body.innerHTML;});
</script>
</body>
</html>
