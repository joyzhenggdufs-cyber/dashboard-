<style>
:root {
  --bg:#08090a; --panel:#0f1011; --surface:#191a1b; --surface2:#232427;
  --text:#f7f8f8; --body:#d0d6e0; --muted:#8a8f98; --quiet:#62666d;
  --accent:#7170ff; --accent-dim:#5e6ad2; --green:#27a644; --red:#e5484d;

}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:'cv01','ss03';display:flex;min-height:100vh}
/* Sidebar */
nav{width:var(--nav-width);background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;position:fixed;top:0;left:0;height:100%;z-index:50;overflow-y:auto}
nav h2{font-size:14px;font-weight:590;color:var(--text);padding:0 6px;margin-bottom:12px;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}

nav .nav-item:hover{background:var(--surface)}
nav .nav-item.active{background:var(--accent-dim);color:var(--text);font-weight:510}
nav .nav-item .icon{width:18px;text-align:center;font-size:14px}
nav .nav-divider{height:1px;background:var(--border-sub);margin:8px 6px}
/* Main */
main{margin-left:var(--nav-width);flex:1;padding:28px 32px 48px;max-width:1100px}
main h1{font-size:18px;font-weight:510;color:var(--text);margin-bottom:20px;letter-spacing:-.2px}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--border-sub);border-radius:var(--radius-card);padding:18px 20px;cursor:pointer;transition:border-color .15s}
.stat:hover{border-color:var(--border)}
.stat .n{font-size:36px;font-weight:510;color:var(--text);letter-spacing:-1px}
.stat .l{font-size:11px;color:var(--muted);font-weight:450;text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.stat .s{font-size:11px;color:var(--quiet);margin-top:1px}
/* Grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--border-sub);border-radius:var(--radius-card);padding:16px 18px}
.card h3{font-size:10px;color:var(--muted);font-weight:510;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px}
.item{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:13px;color:var(--body);border-bottom:1px solid var(--border-sub)}.item:last-child{border-bottom:none}
.item .r{font-size:11px;color:var(--quiet)}
.item .tag{font-size:10px;font-weight:510;padding:2px 6px;border-radius:4px;background:var(--accent-dim);color:var(--text);opacity:.85}
.item .tag.grn{background:rgba(39,166,68,.15);color:var(--green)}
.item .tag.red{background:rgba(229,72,77,.15);color:var(--red)}
.map{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.map span{font-size:11px;color:var(--muted);background:var(--surface);padding:3px 8px;border-radius:var(--radius);border:1px solid var(--border-sub)}
.map span em{font-style:normal;color:var(--accent)}
/* Detail page */
.detail-header{display:flex;align-items:flex-start;gap:20px;margin-bottom:32px}
.detail-header .icon-xl{width:48px;height:48px;background:var(--accent-dim);border-radius:var(--radius-card);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.detail-header h2{font-size:24px;font-weight:510;color:var(--text);letter-spacing:-.5px}
.detail-header p{font-size:14px;color:var(--muted);margin-top:4px;max-width:600px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.detail-card{background:var(--panel);border:1px solid var(--border-sub);border-radius:var(--radius-card);padding:18px}
.detail-card h4{font-size:10px;color:var(--muted);font-weight:510;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px}
.detail-card .metric{font-size:28px;font-weight:510;color:var(--text);letter-spacing:-.5px}
.detail-card .metric-sub{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:510;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--body);margin-bottom:12px}
.badge.active{background:rgba(39,166,68,.1);border-color:rgba(39,166,68,.2);color:var(--green)}
.badge.pending{background:rgba(196,144,59,.1);border-color:rgba(196,144,59,.2);color:var(--amber)}
.detail-list{margin-top:12px}
.detail-list li{font-size:13px;color:var(--body);padding:6px 0;border-bottom:1px solid var(--border-sub)}
.detail-list li:last-child{border:0}
/* Connections bar */
.conns{display:flex;gap:12px;margin-bottom:28px}
.conn{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:450;color:var(--quiet)}
.conn::before{content:'';width:5px;height:5px;border-radius:50%}
.conn.on::before{background:var(--green)}.conn.off::before{background:var(--red)}
@media(max-width:768px){nav{display:none}main{margin-left:0}.stats{grid-template-columns:1fr 1fr}.grid,.detail-grid{grid-template-columns:1fr}}
</style>
