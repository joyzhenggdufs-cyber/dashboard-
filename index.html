<style>
:root {
--bg:#FBF7F2; --card:#FFFBF7; --border:#E8DDD4; --accent:#C49B7C; --accent2:#A67B5B;
--text:#3D322B; --muted:#8B7D74; --green:#7DA37D; --red:#C47B7B; --amber:#C49B5B; --blue:#7B9EC4;
--radius:18px; --radius-sm:10px;
font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-size:14px;padding:20px;max-width:1100px;margin:0 auto;line-height:1.5;-webkit-font-smoothing:antialiased}
/* Top bar — Raycast style */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding:0 4px}
.topbar h1{font-size:24px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
.topbar .time{font-size:13px;color:var(--muted)}
.quick-search{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 14px;font-size:13px;color:var(--muted);cursor:text;width:200px;text-align:left}
/* Connection pips */
.conn-row{display:flex;gap:12px;margin-bottom:24px}
.conn-pip{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);background:var(--card);padding:5px 10px;border-radius:20px;border:1px solid var(--border)}
.conn-pip .d{width:7px;height:7px;border-radius:50%}
.conn-pip .d.on{background:var(--green)}
.conn-pip .d.off{background:var(--red)}
/* Hero stats — Apple Health ring style */
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.hero-card{background:var(--card);border-radius:var(--radius);padding:20px;text-align:center;border:1px solid var(--border);cursor:pointer;transition:transform .15s;position:relative;overflow:hidden}
.hero-card:hover{transform:translateY(-2px)}
.hero-card .ring{display:inline-block;margin-bottom:8px}
.hero-card svg{width:60px;height:60px}
.hero-card .val{font-size:26px;font-weight:700;letter-spacing:-1px}
.hero-card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.hero-card .trend{font-size:10px;margin-top:2px}
/* Grid sections */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.section-card{background:var(--card);border-radius:var(--radius);padding:16px 18px;border:1px solid var(--border)}
.section-card h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;font-weight:500}
.mini-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.mini-item:last-child{border:0}
.mini-item .stars{color:var(--amber);font-size:12px}
.mini-item .tag{font-size:9px;padding:2px 5px;border-radius:3px;background:var(--accent);color:#fff}
.mini-item .tag.red{background:var(--red)} .mini-item .tag.green{background:var(--green)}
/* Map */
.map-grid{display:flex;flex-wrap:wrap;gap:6px}
.map-chip{display:flex;align-items:center;gap:3px;font-size:11px;background:var(--card);padding:5px 8px;border-radius:6px;border:1px solid var(--border)}
.map-chip .via{font-size:9px;color:var(--muted)}
/* Panel */
.panel-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(61,50,43,.18);z-index:99;display:none}
.panel-overlay.show{display:block}
.panel{position:fixed;top:0;right:0;width:440px;max-width:92vw;height:100%;background:rgba(251,247,242,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:-2px 0 30px rgba(0,0,0,.1);z-index:100;padding:28px 24px;overflow-y:auto;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1)}
.panel.show{transform:translateX(0)}
.panel h2{font-size:20px;font-weight:600;margin-bottom:18px}
.panel .close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--border);border:0;cursor:pointer;font-size:15px;color:var(--muted)}
.p-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.p-item:last-child{border:0}
/* Mobile */
@media(max-width:680px){.hero{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:420px){.hero{grid-template-columns:1fr}}
</style>
</head>

function P(type){

}
