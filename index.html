<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes 工作台</title>
<style>
:root {
--bg:#FBF7F2; --card:#FFFBF7; --border:#E8DDD4; --accent:#C49B7C; --accent2:#A67B5B;
--text:#3D322B; --muted:#8B7D74; --green:#7DA37D; --red:#C47B7B; --amber:#C49B5B;
--radius:18px; --shadow:0 1px 3px rgba(61,50,43,.06),0 4px 12px rgba(61,50,43,.04);
font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-size:14px;padding:24px 20px 48px;max-width:1000px;margin:0 auto;line-height:1.5}
/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.header h1{font-size:22px;font-weight:600;letter-spacing:-.3px}
.conn-dots{display:flex;gap:10px}
.conn-dot{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.conn-dot .dot{width:8px;height:8px;border-radius:50%}
.conn-dot .dot.on{background:var(--green)}
.conn-dot .dot.off{background:var(--red)}
/* Cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.card{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;border:1px solid transparent}
.card:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(61,50,43,.08),0 8px 20px rgba(61,50,43,.06);border-color:var(--border)}
.card h3{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:8px;letter-spacing:1px;text-transform:uppercase}
.card .stat{font-size:28px;font-weight:600;letter-spacing:-1px}
.card .stat span{font-size:14px;font-weight:400;color:var(--muted)}
.card .items{margin-top:10px;font-size:13px;color:var(--text)}
.card .items .item{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--border)}
.card .items .item:last-child{border-bottom:none}
.item .tag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--accent);color:#fff;opacity:.8}
.item .tag.red{background:var(--red)}
/* Slide panel */
.panel-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.15);z-index:99;display:none}
.panel-overlay.show{display:block}
.panel{position:fixed;top:0;right:0;width:420px;max-width:90vw;height:100%;background:rgba(251,247,242,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:-4px 0 24px rgba(0,0,0,.08);z-index:100;padding:24px;overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.panel.show{transform:translateX(0)}
.panel h2{font-size:20px;margin-bottom:16px;font-weight:600}
.panel .close{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;background:var(--border);border:none;cursor:pointer;font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.panel-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;display:flex;justify-content:space-between;align-items:center}
.panel-item:last-child{border-bottom:none}
/* Sections */
.section{margin-bottom:20px}
.section h2{font-size:15px;color:var(--muted);font-weight:500;margin-bottom:10px;letter-spacing:.5px}
.map{display:flex;flex-wrap:wrap;gap:8px}
.map-item{display:flex;align-items:center;gap:4px;font-size:12px;background:var(--card);padding:6px 10px;border-radius:8px;border:1px solid var(--border)}
.map-item .arrow{color:var(--accent)}
.map-item .via{font-size:10px;color:var(--muted);margin-left:2px}
.declutter-item{padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)}
.declutter-item:last-child{border-bottom:none}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="panel-overlay" id="overlay"></div>
<div class="panel" id="panel"><button class="close" id="closePanel">✕</button><div id="panelContent"></div></div>

<div class="header">
  <h1>⚡ Hermes 工作台</h1>
  <div class="conn-dots" id="connDots"></div>
</div>

<div class="grid">
  <div class="card" onclick="openPanel('reading')">
    <h3>📖 伴读 · <span id="readingCount">0</span>条</h3>
    <div class="items" id="readingItems"></div>
  </div>
  <div class="card" onclick="openPanel('cron')">
    <h3>⏰ 任务 · <span id="cronOk">0</span>/<span id="cronTotal">0</span></h3>
    <div class="items" id="cronItems"></div>
  </div>
  <div class="card" onclick="openPanel('ideas')">
    <h3>💡 灵感 · <span id="ideasCount">0</span>条</h3>
    <div class="items" id="ideasItems"></div>
  </div>
  <div class="card" onclick="openPanel('skills')">
    <h3>🧩 Skills · <span id="skillsCount">0</span>个</h3>
    <div class="items" id="skillsItems"></div>
  </div>
</div>

<div class="section">
  <h2>🔗 连线</h2>
  <div class="map" id="map"></div>
</div>

<div class="section">
  <h2>📁 Obsidian</h2>
  <div id="obsidian"></div>
</div>

<div class="section">
  <h2>🧹 断舍离</h2>
  <div id="declutter"></div>
</div>

<div class="section">
  <h2>🤖 Codex 项目</h2>
  <div id="codex"></div>
</div>

<div style="text-align:center;color:var(--muted);font-size:11px;margin-top:24px">
  最后同步 · <span id="updated">—</span>
</div>

<script>
// LIVE_DATA injected by refresh.py
const D = LIVE_DATA;

// Connection dots
document.getElementById('connDots').innerHTML = D.connections.map(c =>
  `<div class="conn-dot"><span class="dot ${c.ok?'on':'off'}"></span>${c.icon} ${c.name}</div>`
).join('');

// Reading card
document.getElementById('readingCount').textContent = D.reading.total;
document.getElementById('readingItems').innerHTML = D.reading.recent.slice(0,3).map(i =>
  `<div class="item">${i.rating ? '⭐'.repeat(i.rating) : '📌'} ${i.title} <span class="tag">${i.type}</span></div>`
).join('') || '<div class="item" style="color:var(--muted)">暂无</div>';

// Cron card
document.getElementById('cronOk').textContent = D.cron.ok;
document.getElementById('cronTotal').textContent = D.cron.total;
document.getElementById('cronItems').innerHTML = D.cron.jobs.filter(j=>j.last_status==='error').slice(0,3).map(j =>
  `<div class="item">🔴 ${j.name||j.id}</div>`
).join('') + D.cron.jobs.filter(j=>j.last_status==='ok').slice(0,2).map(j =>
  `<div class="item">🟢 ${j.name||j.id}</div>`
).join('') || '<div class="item" style="color:var(--muted)">全部正常</div>';

// Ideas card
document.getElementById('ideasCount').textContent = D.ideas.total;
document.getElementById('ideasItems').innerHTML = D.ideas.recent.map(i =>
  `<div class="item">💡 ${i.idea?.substring(0,40)||''} <span class="tag">${i.tag||''}</span></div>`
).join('') || '<div class="item" style="color:var(--muted)">暂无</div>';

// Skills card
document.getElementById('skillsCount').textContent = D.skills.length;
document.getElementById('skillsItems').innerHTML = D.skills.slice(0,4).map(s =>
  `<div class="item">🧩 ${s.name}</div>`
).join('');

// Connection map
document.getElementById('map').innerHTML = D.connection_map.map(c =>
  `<div class="map-item">${c.icon} ${c.from} <span class="arrow">→</span> ${c.to} <span class="via">·${c.via}</span></div>`
).join('');

// Obsidian
document.getElementById('obsidian').innerHTML = D.obsidian.map(f =>
  `<div class="card" style="margin-bottom:8px;cursor:pointer" onclick="openObsidian('${f.name}')">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span>${f.icon} ${f.name} · ${f.count}篇</span><span style="color:var(--accent);font-size:12px">→</span>
    </div>
  </div>`
).join('');

// Declutter
let dd = D.declutter;
let dl = '';
if (dd.pending && dd.pending.length) dl += dd.pending.map(i => `<div class="declutter-item">📋 ${i.name||'?'} (${i.category||'?'})</div>`).join('');
if (dd.done_recent && dd.done_recent.length) dl += dd.done_recent.map(i => `<div class="declutter-item">✅ ${i.name||'?'} — ${i.method||''}</div>`).join('');
document.getElementById('declutter').innerHTML = dl || '<div style="color:var(--muted);font-size:13px">暂无</div>';

// Codex
document.getElementById('codex').innerHTML = D.codex.map(p =>
  `<div class="card" style="margin-bottom:8px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span>🤖 ${p.name} · ${p.file_count}文件</span>
      <span style="font-size:11px;color:var(--muted)">${p.subdirs.join(' · ')}</span>
    </div>
  </div>`
).join('') || '<div style="color:var(--muted);font-size:13px">暂无</div>';

// Updated
document.getElementById('updated').textContent = D.updated;

// Panel
function openPanel(type) {
  let html = '';
  if (type === 'reading') {
    html = '<h2>📖 伴读</h2>';
    if (D.reading.toread.length) {
      html += '<h3 style="margin-top:12px;color:var(--muted)">📌 待读</h3>';
      D.reading.toread.forEach(i => html += `<div class="panel-item">${i.title} <span class="tag">${i.type}</span></div>`);
    }
    html += '<h3 style="margin-top:12px;color:var(--muted)">⭐ 已读</h3>';
    D.reading.read.forEach(i => html += `<div class="panel-item">${'⭐'.repeat(i.rating||0)} ${i.title} <span class="tag">${i.type}</span></div>`);
  } else if (type === 'cron') {
    html = '<h2>⏰ 任务</h2>';
    D.cron.jobs.forEach(j => html += `<div class="panel-item">${j.last_status==='error'?'🔴':'🟢'} ${j.name||j.id} <span style="font-size:10px;color:var(--muted)">${j.schedule||''}</span></div>`);
  } else if (type === 'ideas') {
    html = '<h2>💡 灵感碎片</h2>';
    D.ideas.recent.forEach(i => html += `<div class="panel-item">[${i.tag||''}] ${i.idea||''} <span style="font-size:10px;color:var(--muted)">${i.time||''}</span></div>`);
  } else if (type === 'skills') {
    html = '<h2>🧩 Skills</h2>';
    D.skills.forEach(s => html += `<div class="panel-item"><div><strong>${s.name}</strong><br><span style="font-size:11px;color:var(--muted)">${s.desc.substring(0,80)}</span></div></div>`);
  }
  document.getElementById('panelContent').innerHTML = html;
  document.getElementById('panel').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}

function openObsidian(name) {
  let f = D.obsidian.find(o => o.name === name);
  if (!f) return;
  let html = `<h2>📁 ${f.icon} ${name}</h2>`;
  f.items.forEach(i => html += `<div class="panel-item">${i.title.substring(0,60)}</div>`);
  document.getElementById('panelContent').innerHTML = html;
  document.getElementById('panel').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}

document.getElementById('closePanel').onclick = () => {
  document.getElementById('panel').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
};
document.getElementById('overlay').onclick = () => {
  document.getElementById('panel').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
};
</script>
</body>
</html>
