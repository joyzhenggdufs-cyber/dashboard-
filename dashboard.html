<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hermes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,450;14..32,510;14..32,590&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090a;--panel:#0f1011;--surface:#191a1b;--surface2:#232427;--text:#f7f8f8;--body:#d0d6e0;--muted:#8a8f98;--quiet:#62666d;--accent:#7170ff;--accent-dim:#5e6ad2;--green:#27a644;--red:#e5484d;--amber:#c4903b;--border:rgba(255,255,255,.08);--border-sub:rgba(255,255,255,.05);--radius:6px;--radius-card:12px;--nav-width:200px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:'cv01','ss03';display:flex;min-height:100vh}
nav{width:var(--nav-width);background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;flex-shrink:0;position:fixed;top:0;left:0;height:100%;z-index:50;overflow-y:auto}
nav h2{font-size:14px;font-weight:590;color:var(--text);padding:0 6px;margin-bottom:12px;letter-spacing:-.2px}
nav .nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius);font-size:13px;font-weight:450;color:var(--body);cursor:grab;transition:background .1s;user-select:none}
nav .nav-item:active{cursor:grabbing}
nav .nav-item.drag-over{background:var(--accent-dim);outline:1px dashed var(--accent)}
nav .nav-item:hover{background:var(--surface)}
nav .nav-item.active{background:var(--accent-dim);color:var(--text);font-weight:510}
nav .nav-divider{height:1px;background:var(--border-sub);margin:8px 6px}
main{margin-left:var(--nav-width);flex:1;padding:28px 32px 48px;max-width:1100px}
h1{font-size:18px;font-weight:510;color:var(--text);margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--border-sub);border-radius:var(--radius-card);padding:18px 20px;cursor:pointer}
.stat:hover{border-color:var(--border)}
.stat .n{font-size:36px;font-weight:510;color:var(--text);letter-spacing:-1px}
.stat .l{font-size:11px;color:var(--muted);font-weight:450;text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.stat .s{font-size:11px;color:var(--quiet)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--border-sub);border-radius:var(--radius-card);padding:16px 18px}
.card h3,.card h4{font-size:10px;color:var(--muted);font-weight:510;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px}
.item{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid var(--border-sub)}.item:last-child{border-bottom:none}
.r{font-size:11px;color:var(--quiet)}.tag{font-size:10px;font-weight:510;padding:2px 6px;border-radius:4px;background:var(--accent-dim);color:var(--text);opacity:.85}
.tag.grn{background:rgba(39,166,68,.15);color:var(--green)}.tag.red{background:rgba(229,72,77,.15);color:var(--red)}
.map{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.map span{font-size:11px;color:var(--muted);background:var(--surface);padding:3px 8px;border-radius:var(--radius);border:1px solid var(--border-sub)}
.map span em{font-style:normal;color:var(--accent)}
.detail-header{display:flex;align-items:flex-start;gap:20px;margin-bottom:24px}
.detail-header .icon-xl{width:48px;height:48px;background:var(--accent-dim);border-radius:var(--radius-card);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.detail-header h2{font-size:24px;font-weight:510;color:var(--text)}
.detail-header p{font-size:14px;color:var(--muted);margin-top:4px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.detail-card{background:var(--panel);border:1px solid var(--border-sub);border-radius:var(--radius-card);padding:18px}
.detail-card .metric{font-size:28px;font-weight:510;color:var(--text);letter-spacing:-.5px}
.detail-card .metric-sub{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:510;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--body);margin-bottom:16px}
.badge.active{background:rgba(39,166,68,.1);border-color:rgba(39,166,68,.2);color:var(--green)}
.badge.pending{background:rgba(196,144,59,.1);border-color:rgba(196,144,59,.2);color:var(--amber)}
.detail-list{margin-top:8px}.detail-list li{font-size:13px;color:var(--body);padding:6px 0;border-bottom:1px solid var(--border-sub)}.detail-list li:last-child{border:0}
.conns{display:flex;gap:12px;margin-bottom:28px}
.conn{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:450;color:var(--quiet)}
.conn::before{content:'';width:5px;height:5px;border-radius:50%}.conn.on::before{background:var(--green)}.conn.off::before{background:var(--red)}
@media(max-width:768px){nav{display:none}main{margin-left:0}.stats{grid-template-columns:1fr 1fr}.grid,.detail-grid{grid-template-columns:1fr}}
.eye-btn{position:fixed;top:20px;right:24px;background:var(--surface);border:1px solid var(--border);color:var(--muted);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;z-index:200;transition:color .2s}
.eye-btn:hover{color:var(--text)}
.blur-num{filter:blur(8px)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}.ov.s{display:block}
.pn{position:fixed;top:0;right:0;width:420px;max-width:92vw;height:100%;background:var(--panel);border-left:1px solid var(--border);z-index:100;padding:24px;overflow-y:auto;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}.pn.s{transform:translateX(0)}
.pn h2{font-size:18px;font-weight:510;color:var(--text);margin-bottom:16px}
.pn .close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.pi{padding:8px 0;border-bottom:1px solid var(--border-sub);font-size:13px;color:var(--body);display:flex;justify-content:space-between}.pi:last-child{border:0}

</style>
</head>
<body>
<nav>
  <h2>⚡ Hermes</h2>
  <div class="nav-item active" id="nav-overview" onclick="showOverview()">◉ 总览</div>
  <div class="nav-divider"></div>
  <div class="nav-item" onclick="showDetail('declutter')">🧹 断舍离</div>
  <div class="nav-item" onclick="showDetail('finance')">💰 财富管理</div>
  <div class="nav-item" onclick="showDetail('health')">🩺 健康管理</div>
  <div class="nav-item" onclick="showDetail('reading')">📖 伴读</div>
  <div class="nav-item" onclick="showDetail('cron')">⏰ 任务</div>
  <div class="nav-item" onclick="showDetail('skills')">🧩 Skills</div>
  <div class="nav-item" onclick="showDetail('ideas')">💡 灵感</div>
  <div class="nav-item" onclick="showDetail('diary')">📓 日记</div>
  <div class="nav-item" id="nav-changelog" onclick="showChangelog()">📋 更新日志</div>
  <div class="nav-divider"></div>
  <div id="eye" class="nav-item" onclick="toggleEye()" title="隐藏/显示金额">👁️ 隐藏金额</div>
</nav>
<main id="main"></main>
<div class="ov" id="ov" onclick="cls()"></div>
<div class="pn" id="pn"><button class="close" onclick="cls()">✕</button><div id="pc"></div></div>

<script>
// data.json is loaded as window.D
fetch('data.json?t='+Date.now()).then(r=>r.json()).then(D=>{window.D=D;initDrag();showOverview()});

// ── Drag and drop nav items ──
function initDrag(){
  const nav=document.querySelector('nav');
  if(!nav) return;
  // Load saved order
  let order=JSON.parse(localStorage.getItem('hermes_nav_order')||'null');
  const items=[...nav.querySelectorAll('.nav-item:not(#nav-overview):not(#eye)')];
  const container=items[0].parentNode;
  
  if(order && order.length===items.length){
    // Apply saved order (before dividers)
    const frag=document.createDocumentFragment();
    order.forEach(key=>{
      const el=nav.querySelector(`[data-nav="${key}"]`);
      if(el) frag.appendChild(el);
    });
    // Re-insert after overview + divider
    const after=nav.querySelector('#nav-overview').nextSibling; // divider
    items.forEach(el=>{if(el.parentNode)el.remove();});
    let ref=after;
    while(frag.firstChild){nav.insertBefore(frag.firstChild,ref?.nextSibling||null);ref=nav.querySelector('[data-nav]');}
  }
  
  items.forEach(el=>{
    el.setAttribute('draggable','true');
    if(!el.dataset.nav) el.dataset.nav=el.textContent.replace(/[^\w\u4e00-\u9fff]/g,'_').substring(0,20);
    el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.nav);el.style.opacity='0.4';});
    el.addEventListener('dragend',e=>{el.style.opacity='1';items.forEach(i=>i.classList.remove('drag-over'));saveOrder(nav);});
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over');});
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',e=>{
      e.preventDefault();el.classList.remove('drag-over');
      const src_key=e.dataTransfer.getData('text/plain');
      const src=nav.querySelector(`[data-nav="${src_key}"]`);
      if(src&&src!==el){el.parentNode.insertBefore(src,el);saveOrder(nav);}
    });
  });
}
function saveOrder(nav){
  const keys=[...nav.querySelectorAll('.nav-item[data-nav]')].map(el=>el.dataset.nav);
  localStorage.setItem('hermes_nav_order',JSON.stringify(keys));
}

function updateConns(){
  document.querySelectorAll('.conns').forEach(e=>e.remove());
  let c=document.createElement('div');c.className='conns';
  window.D.connections.forEach(x=>{c.innerHTML+=`<div class="conn ${x.ok?'on':'off'}">${x.icon} ${x.name}</div>`});
  document.querySelector('main').prepend(c);
}

function setActive(id){document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));document.getElementById(id).classList.add('active');}


function showBreakdown(type){
 let D=window.D,f=D.finance,items=[],t='';
 if(type==='assets'){
  t='💰 净资产明细 · ¥'+f.net_worth;
  items=[
   {l:'💵 现金及活期',r:'¥'+f.cash},
   {l:'🥇 黄金（支付宝）',r:'¥'+f.gold},
   {l:'📈 基金（同花顺）',r:'¥'+f.funds},
   {l:'📊 A股（同花顺）',r:'¥'+f.stocks},
   {l:'🏠 公积金（广州+中山）',r:'¥'+f.housing_fund},
   {l:'🛡️ 中意寿险（现价）',r:'¥'+f.insurance},
   {l:'👴 养老个账',r:'¥'+f.pension},
   {l:'💳 信用卡负债',r:'-¥'+f.liabilities,color:'var(--red)'},
   {l:'━━━━━━━━━━━━',r:''},
   {l:'',r:'¥'+f.net_worth,color:'var(--text)',bold:true}
  ];
 }else if(type==='investable'){
  t='💰 可投资净资产明细 · ¥'+f.investable;
  items=[
   {l:'💵 现金及活期',r:'¥'+f.cash},
   {l:'🥇 黄金（支付宝）',r:'¥'+f.gold},
   {l:'📈 基金（同花顺）',r:'¥'+f.funds},
   {l:'📊 A股（同花顺）',r:'¥'+f.stocks},
   {l:'💳 信用卡负债',r:'-¥'+f.liabilities,color:'var(--red)'},
   {l:'━━━━━━━━━━━━',r:''},
   {l:'',r:'¥'+f.investable,color:'var(--text)',bold:true}
  ];
 }
 document.getElementById('pc').innerHTML='<h2>'+t+'</h2>'+items.map(i=>{
  let style=i.color?'color:'+i.color+(i.bold?';font-weight:510':''):'';
  return '<div class="pi"><span style="'+style+'">'+i.l+'</span><span style="'+style+'">'+i.r+'</span></div>';
 }).join('');
 document.getElementById('pn').classList.add('s');document.getElementById('ov').classList.add('s');
}
function cls(){document.getElementById('pn').classList.remove('s');document.getElementById('ov').classList.remove('s');}

function toggleEye(){
 let el=document.getElementById('eye'),blur=document.querySelectorAll('.stat .n');
 if(el.dataset.hidden==='1'){
  el.innerHTML='👁️ 隐藏金额';el.dataset.hidden='0';
  blur.forEach(b=>b.classList.remove('blur-num'));
 }else{
  el.innerHTML='🙈 显示金额';el.dataset.hidden='1';
  blur.forEach(b=>b.classList.add('blur-num'));
 }
}

function showOverview(){
 setActive('nav-overview');
 let D=window.D,crOk=D.cron.ok,crT=D.cron.total;
 let H='<h1>总览</h1>';
 H+=`<div style="font-size:11px;color:var(--quiet);margin-bottom:20px">🔄 同步 · ${D.updated}</div>`;
 H+=`<div class="stats">`;
 H+=`<div class="stat" onclick="showDetail('cron')"><div class="n">${crOk}/${crT}</div><div class="l">Cron 任务</div><div class="s">${crOk>crT-2?'全部正常':(crT-crOk)+' 异常'}</div></div>`;
 H+=`<div class="stat" onclick="showDetail('reading')"><div class="n">${D.reading.total}</div><div class="l">伴读</div><div class="s">${D.reading.toread.length} 待读</div></div>`;
 H+=`<div class="stat" onclick="showDetail('skills')"><div class="n">${D.skills.length}</div><div class="l">Skills</div><div class="s">活跃能力</div></div>`;
 H+=`<div class="stat" onclick="showDetail('health')"><div class="n">${D.health.score||'?'}</div><div class="l">健康分</div><div class="s">${D.health.sleep||'?'} · ${D.health.resting_hr||'?'}</div></div>
<div class="stat" onclick="showBreakdown('assets')"><div class="n">¥${D.finance.assets}</div><div class="l">总资产</div><div class="s">¥${D.finance.net_worth} 净资产</div></div>
<div class="stat" onclick="showBreakdown('investable')"><div class="n">${D.finance.invest_progress}%</div><div class="l">投资目标</div><div class="s">¥${D.finance.investable||D.finance.invest_total} / ¥1,000,000</div></div>`;
 H+=`</div>`;
 H+=`<div class="grid">`;
 H+=`<div class="card"><h3>📖 伴读</h3>${D.reading.recent.map(i=>`<div class="item"><span>${i.rating?'⭐'.repeat(i.rating):'📌'} ${i.title}</span><span class="tag">${i.type}</span></div>`).join('')||'<div class="item"><span style="color:var(--quiet)">暂无</span></div>'}</div>`;
 H+=`<div class="card"><h3>⏰ 任务</h3>${D.cron.jobs.filter(j=>j.last_status==='error').slice(0,3).map(j=>`<div class="item"><span>${j.name||j.id}</span><span class="tag red">异常</span></div>`).join('')||'<div class="item"><span style="color:var(--green)">全部正常</span><span class="tag grn">OK</span></div>'}</div>`;
 H+=`<div class="card"><h3>💡 灵感</h3>${D.ideas.recent.map(i=>`<div class="item"><span>[${i.tag}] ${(i.idea||'').substring(0,35)}</span></div>`).join('')||'<div class="item"><span style="color:var(--quiet)">暂无</span></div>'}</div>`;
 H+=`<div class="card"><h3>💰 财富</h3><div class="item"><span>总资产</span><span style="color:var(--text);font-weight:510">¥${D.finance.assets}</span></div><div class="item"><span>投资目标</span><span style="color:var(--accent)">${D.finance.invest_progress}%</span></div><div class="item"><span>月结余</span><span style="color:var(--green)">¥${D.finance.savings}</span></div></div>`;
 H+=`</div>`;
 H+=`<div class="grid">`;
 H+=`<div class="card"><h3>🔗 数据连线</h3><div class="map">${D.connection_map.map(c=>`<span>${c.icon} ${c.from} <em>→</em> ${c.to}</span>`).join('')}</div></div>`;
 H+=`<div class="card"><h3>🗺️ 足迹</h3><div class="item"><span>🌍 国家</span><span>${D.footprint.countries}</span></div><div class="item"><span>🏙️ 中国城市</span><span>${D.footprint.cities_cn}</span></div></div>`;
 H+=`<div class="card"><h3>📁 Obsidian</h3>${D.obsidian.map(f=>`<div class="item"><span>${f.icon} ${f.name}</span><span>${f.count}篇</span></div>`).join('')}</div>`;
 H+=`<div class="card"><h3>🤖 Codex</h3>${D.codex.map(p=>`<div class="item"><span>${p.name}</span><span>${p.file_count}文件</span></div>`).join('')||'暂无'}</div>`;
 H+=`</div>`;
 H+=`<div class="card" style="margin-top:12px"><h3>📓 日记</h3>${(D.diary||[]).map(e=>`<div class="item"><span>${e.date}</span><span style="font-size:12px;color:var(--muted)">${e.section}</span></div>`).join('')||'<div class="item"><span style="color:var(--quiet)">暂无</span></div>'}</div>`;
 H+=`<div class="card" style="margin-top:12px"><h3>🧠 工作哲学</h3><div class="item"><span>📋 STATE.md 铁律</span><span style="font-size:11px;color:var(--quiet)">不确定时先读STATE.md再回答</span></div><div class="item"><span>🧘 慢即是快</span><span style="font-size:11px;color:var(--quiet)">允许迟疑、反思、承认不确定</span></div><div class="item"><span>📂 不重复造轮子</span><span style="font-size:11px;color:var(--quiet)">能归入旧项目就优先归入</span></div><div class="item"><span>✂️ 留痕有度</span><span style="font-size:11px;color:var(--quiet)">重要操作留痕，临时试错不过度记录</span></div></div>`;
 document.getElementById('main').innerHTML=H;updateConns();
}

function showDetail(project){
 document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
 let navEl=document.querySelector(`.nav-item[onclick*="${project}"]`);
 if(navEl)navEl.classList.add('active');
 let D=window.D,H='';

 if(project==='declutter'){
  let dd=D.declutter;let ddd=D.declutter_detail||{};
  H+=`<div class="detail-header"><div class="icon-xl">🧹</div><div><h2>断舍离</h2><p>物品登记与处理追踪</p></div></div>`;
  H+=`<div class="badge active">活跃</div>`;
  H+=`<div class="detail-grid"><div class="detail-card"><h4>📊 总览</h4><div class="metric">${dd.total||0}</div><div class="metric-sub">总物品 · ${dd.pending||0} 待处理 · ${dd.done||0} 已处理</div></div>`;
  H+=`<div class="detail-card"><h4>📂 分类</h4>${Object.entries(ddd.categories||{}).map(([k,v])=>`<div class="metric-sub">${k}: ${v}件</div>`).join('')||'暂无'}</div></div>`;
  H+=`<div class="card"><h4>📋 物品清单</h4><ul class="detail-list">${(ddd.pending_list||[]).map(i=>`<li>${i.name||'?'} <span class="tag">${i.category||''}</span></li>`).join('')||'<li style="color:var(--quiet)">全部处理完毕</li>'}</ul></div>`;
  H+=`<div class="card" style="margin-top:12px"><h4>⏭️ 下一步</h4><ul class="detail-list"><li>微信/飞书说「断舍离」登记待处理物品</li><li>每周日 20:30 自动推送周报</li></ul></div>`;

 }else if(project==='finance'){
  let f=D.finance;
  H+=`<div class="detail-header"><div class="icon-xl">💰</div><div><h2>财富管理 · 百万计划</h2><p>可投资 ¥${f.investable||f.invest_total||'?'} · 储蓄率 ${f.savings_rate}% · 应急 ${f.emergency_months} 个月</p></div></div>`;
  H+=`<div class="badge active">更新至 ${f.updated}</div>`;
  H+=`<div class="detail-grid">`;
  H+=`<div class="detail-card"><h4>💰 可投资净资产</h4><div class="metric">¥${f.investable||f.invest_total||'?'}</div><div class="metric-sub">现金+黄金+基金+A股−负债</div></div>`;
  H+=`<div class="detail-card"><h4>🏦 总净资产</h4><div class="metric">¥${f.net_worth||f.assets||'?'}</div><div class="metric-sub">含公积金+养老+寿险</div></div>`;
  H+=`<div class="detail-card"><h4>🆘 应急覆盖</h4><div class="metric">${f.emergency_months} 个月</div><div class="metric-sub">现金 ÷ 月支出 · 目标 ≥3</div></div>`;
  H+=`<div class="detail-card"><h4>🎯 投资目标</h4><div class="metric">${f.invest_progress}%</div><div class="metric-sub">¥${f.investable||f.invest_total||'?'} / ¥1,000,000</div></div>`;
  H+=`<div class="detail-card"><h4>💰 储蓄率</h4><div class="metric">${f.savings_rate}%</div><div class="metric-sub">月存 ¥${f.savings} / 月入 ¥${f.income}</div></div>`;
  H+=`<div class="detail-card"><h4>📊 资产配置</h4><div class="metric-sub">A股 30% · 公积金 25% · 养老 16% · 基金 12% · 寿险 9% · 黄金 7% · 现金 1%</div></div>`;
  H+=`</div>`;
  H+=`<div class="card"><h4>🧠 核心理念</h4><ul class="detail-list"><li><span>🧘 注意力也是资产</span><span style="font-size:11px;color:var(--quiet)">不过度关注短期波动</span></li><li><span>📐 仓位 > 成本价</span><span style="font-size:11px;color:var(--quiet)">问占比多少，不问有没有亏</span></li><li><span>🌐 ETF为底座</span><span style="font-size:11px;color:var(--quiet)">分散化、低维护、不盯盘</span></li><li><span>⚙️ 系统 > 预测</span><span style="font-size:11px;color:var(--quiet)">靠配置和再平衡，不靠猜方向</span></li><li><span>💧 流动性优先</span><span style="font-size:11px;color:var(--quiet)">先保现金安全，再谈投资收益</span></li></ul></div>`;
  H+=`<div class="card" style="margin-top:12px"><h4>📊 按流动性分层</h4><ul class="detail-list"><li><span>💧 流动</span><span style="color:var(--text);font-weight:510">¥${f.cash}</span> — 中信+微信+余额宝</li><li><span>🌊 半流动</span><span style="color:var(--text);font-weight:510">¥${(parseInt(f.gold.replace(/,/g,''))+parseInt(f.funds.replace(/,/g,''))+parseInt(f.stocks.replace(/,/g,''))).toLocaleString()}</span> — 黄金+基金+A股</li><li><span>🏔️ 受限</span><span style="color:var(--text);font-weight:510">¥${f.housing_fund}</span> — 公积金</li><li><span>🛡️ 保障</span><span style="color:var(--text);font-weight:510">¥${f.insurance}</span> — 寿险</li></ul></div>`;
  H+=`<div class="card" style="margin-top:12px"><h4>📄 原始文档</h4><ul class="detail-list"><li onclick="window.open('file:///Users/mac/Desktop/claude work/hermes-workbench/财富管理.md')" style="cursor:pointer">📋 财富管理.md <span style="color:var(--accent)">打开</span></li><li onclick="window.open('file:///Users/mac/Desktop/claude work/hermes-workbench/财富快照.md')" style="cursor:pointer">📊 财富快照.md <span style="color:var(--accent)">打开</span></li></ul></div>`;
  H+=`<div class="card" style="margin-top:12px"><h4>⏭️ 下一步</h4><ul class="detail-list"><li>🆘 应急金缺口 · 目标 ¥50,000，当前 ¥${f.cash}</li><li>📊 投资目标差距 ¥${f.invest_gap}</li></ul></div>`;

  // ── 投资网格板块 ──
  let tr = D.trades;
  if(tr && tr.top_line){
    H+=`<div style="margin-top:20px"><h3 style="font-size:14px;font-weight:510;color:var(--text);margin-bottom:12px">📊 投资网格</h3>`;
    // Top Line
    H+=`<div class="detail-grid">`;
    let syms = Object.keys(tr.top_line);
    syms.forEach(k=>{
      let t = tr.top_line[k];
      H+=`<div class="detail-card"><h4>${k}</h4>`;
      if(t.current_price) H+=`<div class="metric">¥${t.current_price} <span style="font-size:12px;color:${(t.day_change_pct||0)>0?'var(--green)':'var(--red)'}">${(t.day_change_pct||0)>0?'+':''}${t.day_change_pct||0}%</span></div>`;
      else if(t.current_value) H+=`<div class="metric">¥${t.current_value.toLocaleString()}</div>`;
      if(t.unrealized_pnl!=null) H+=`<div class="metric-sub" style="color:${t.unrealized_pnl>=0?'var(--green)':'var(--red)'}">浮盈 ¥${t.unrealized_pnl.toLocaleString()} (${t.unrealized_pnl_pct}%)</div>`;
      if(t.realized_pnl!=null) H+=`<div class="metric-sub" style="color:${t.realized_pnl>=0?'var(--green)':'var(--red)'}">已实现 ¥${t.realized_pnl.toLocaleString()}</div>`;
      if(t.note) H+=`<div class="metric-sub" style="color:var(--quiet)">${t.note}</div>`;
      H+=`</div>`;
    });
    H+=`</div>`;

    // 待卖出
    if(tr.pending_sell && tr.pending_sell.length>0){
      H+=`<div class="card" style="margin-top:12px"><h4>⏳ 待卖出 (${tr.pending_count})</h4>`;
      H+=`<table style="width:100%;font-size:12px;border-collapse:collapse;color:var(--body)">`;
      H+=`<tr style="color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px"><td style="padding:4px 8px">品种</td><td>买入价</td><td>数量</td><td>金额</td><td style="color:var(--amber)">目标价</td><td>距目标</td></tr>`;
      tr.pending_sell.forEach(l=>{
        let top = tr.top_line[l.symbol] || {};
        let cur_p = top.current_price || (top.current_value ? top.current_value / (l.quantity||1) : null) || l.buy_price;
        let dist = cur_p && l.target_price ? ((l.target_price-cur_p)/cur_p*100).toFixed(2) : '?';
        H+=`<tr style="border-top:1px solid var(--border-sub)"><td style="padding:6px 8px">${l.symbol}</td><td>¥${l.buy_price||'?'}</td><td>${l.quantity||'?'}份</td><td>¥${l.amount||'?'}</td><td style="color:var(--amber);font-weight:510">¥${l.target_price}</td><td style="color:${dist>0?'var(--amber)':'var(--green)'}">${dist!=='?'?(dist>=0?'+':'')+dist+'%':'?'}</td></tr>`;
      });
      H+=`</table></div>`;
    }

    // 已完成
    if(tr.sold && tr.sold.length>0){
      H+=`<div class="card" style="margin-top:12px"><h4>✅ 已完成 (${tr.sold.length})</h4>`;
      H+=`<table style="width:100%;font-size:12px;border-collapse:collapse;color:var(--body)">`;
      H+=`<tr style="color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px"><td style="padding:4px 8px">品种</td><td>买入日</td><td>买入价</td><td>卖出日</td><td>卖出价</td><td>持有天</td><td>盈亏</td></tr>`;
      tr.sold.forEach(l=>{
        let hold = '?';
        if(l.buy_date && l.sell_date) hold = Math.round((new Date(l.sell_date)-new Date(l.buy_date))/(86400000));
        let pnl = l.realized_pnl||0;
        H+=`<tr style="border-top:1px solid var(--border-sub)"><td style="padding:6px 8px">${l.symbol||'?'}</td><td>${l.buy_date||'?'}</td><td>¥${l.buy_price}</td><td>${l.sell_date||'?'}</td><td>¥${l.sell_price}</td><td>${hold}天</td><td style="color:${pnl>=0?'var(--green)':'var(--red)'}">${pnl>=0?'+':''}¥${pnl.toLocaleString()}</td></tr>`;
      });
      H+=`</table></div>`;
    }
    H+=`</div>`;
  }

 }else if(project==='health'){
  let hh=D.health_detail||D.health,notes=hh.notes||[];
  H+=`<div class="detail-header"><div class="icon-xl">🩺</div><div><h2>健康管理</h2><p>睡眠 ${hh.sleep_hrs||hh.sleep||'?'}h · 静息心率 ${hh.resting_hr||'?'}bpm</p></div></div>`;
  H+=`<div class="badge ${(hh.score||0)>70?'active':'pending'}">健康分 ${hh.score||'?'} · ${hh.sleep_count||hh.date||'?'}</div>`;
  H+=`<div class="detail-grid"><div class="detail-card"><h4>😴 睡眠</h4><div class="metric">${hh.sleep_hrs||hh.sleep||'?'}h</div><div class="metric-sub">深睡 ${hh.deep_h||'?'}h · REM ${hh.rem_h||'?'}h</div></div><div class="detail-card"><h4>❤️ 心率</h4><div class="metric">${hh.resting_hr||'?'}bpm</div></div></div>`;
  H+=`<div class="card"><h4>📋 数据管道</h4><ul class="detail-list"><li>iPhone 健康 App 手动导出 XML → AirDrop</li><li>health_parser.py → health_latest.json</li><li>早报自动集成 · Apple Watch 10:00 推送</li></ul></div>`;

 }else if(project==='reading'){
  H+=`<div class="detail-header"><div class="icon-xl">📖</div><div><h2>伴读</h2><p>${D.reading.total}条 · 豆瓣 RSS 7:00 同步</p></div></div>`;
  H+=`<div class="detail-grid"><div class="detail-card"><h4>📌 待读</h4><div class="metric">${D.reading.toread.length}</div></div><div class="detail-card"><h4>⭐ 已读</h4><div class="metric">${D.reading.read.length}</div></div></div>`;
  H+=`<div class="card"><h4>📌 待读</h4><ul class="detail-list">${D.reading.toread.map(i=>`<li>${i.title} <span class="tag">${i.type}</span></li>`).join('')||'<li style="color:var(--quiet)">全部读完</li>'}</ul></div>`;

 }else if(project==='cron'){
  H+=`<div class="detail-header"><div class="icon-xl">⏰</div><div><h2>Cron 任务</h2><p>${D.cron.ok}/${D.cron.total} 正常</p></div></div>`;
  H+=`<div class="card"><h4>任务列表</h4><ul class="detail-list">${D.cron.jobs.map(j=>`<li><span style="color:${j.last_status==='error'?'var(--red)':'var(--green)'}">●</span> ${j.name||j.id} <span style="font-size:11px;color:var(--quiet)">${j.schedule||''}</span></li>`).join('')}</ul></div>`;

 }else if(project==='skills'){
  H+=`<div class="detail-header"><div class="icon-xl">🧩</div><div><h2>Skills</h2><p>${D.skills.length} 个能力</p></div></div>`;
  H+=`<div class="card"><h4>清单</h4><ul class="detail-list">${D.skills.map(s=>`<li>${s.name} <span style="font-size:11px;color:var(--quiet)">${(s.desc||'').substring(0,50)}</span></li>`).join('')}</ul></div>`;

 }else if(project==='ideas'){
  H+=`<div class="detail-header"><div class="icon-xl">💡</div><div><h2>灵感碎片</h2><p>${D.ideas.total} 条</p></div></div>`;
  H+=`<div class="card"><h4>全部</h4><ul class="detail-list">${D.ideas.recent.map(i=>`<li>[${i.tag}] ${i.idea||''} <span style="font-size:11px;color:var(--quiet)">${i.time||''}</span></li>`).join('')||'<li style="color:var(--quiet)">暂无</li>'}</ul></div>`;
 }else if(project==='diary'){
  H+=`<div class="detail-header"><div class="icon-xl">📓</div><div><h2>日记</h2><p>最近 ${(D.diary||[]).length} 篇</p></div></div>`;
  H+=`<div class="card"><h4>📅 最近日记</h4><ul class="detail-list">${(D.diary||[]).map(e=>`<li><span>${e.date}</span> <span style="color:var(--muted)">${e.section}</span> <span onclick="window.open('obsidian://open?vault=Obsidian+Vault&file=${encodeURIComponent(e.path)}')" style="font-size:11px;color:var(--accent);cursor:pointer;margin-left:8px">打开</span></li>`).join('')||'<li style="color:var(--quiet)">暂无日记</li>'}</ul></div>`;
  H+=`<div class="card" style="margin-top:12px"><h4>⏭️ 写日记</h4><ul class="detail-list"><li>跟我说「写日记」开始记录</li><li>每周六自动生成周总结</li></ul></div>`;
 }
 document.getElementById('main').innerHTML=H;updateConns();
}
