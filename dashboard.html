<style>
  :root {
    --bg: #FBF7F2;
    --card: #FFFBF7;
    --card-hover: #FFF8F0;
    --border: #E8DDD4;
    --accent: #C49B7C;
    --accent-deep: #A67B5B;
    --accent-light: #E8D5C4;
    --clay: #9B8E85;
    --clay-light: #C4B8AF;
    --text: #3D322B;
    --text-muted: #8B7D74;
    --text-light: #B0A399;
    --green: #7DA37D;
    --green-bg: #EDF5EB;
    --red: #C47B7B;
    --red-bg: #FBF0F0;
    --amber: #C49B5B;
    --amber-bg: #FBF3E8;
    --blue: #7B9EC4;
    --blue-bg: #EDF3FA;
    --radius: 18px;
    --radius-sm: 10px;
    --radius-xs: 6px;
    --shadow: 0 1px 3px rgba(61,50,43,0.06), 0 4px 12px rgba(61,50,43,0.04);
    --shadow-lg: 0 1px 2px rgba(61,50,43,0.04), 0 8px 24px rgba(61,50,43,0.06);
    --font-serif: 'Georgia', 'Noto Serif SC', 'Songti SC', 'STSong', serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 24px 20px 48px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .header-icon {
    width: 42px; height: 42px;
    background: var(--accent-light);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .header-text h1 {
    font-family: var(--font-serif);
    font-size: 24px; font-weight: 400;
    color: var(--text); letter-spacing: 0.02em;
  }
  .header-text .sub {
    font-size: 12px; color: var(--text-muted);
  }
  .header-right {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; color: var(--text-muted);
  }
  .header-right .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
  .header-right .dot.warn { background: var(--amber); }
  .header-right .dot.err { background: var(--red); }
  .header-right time {
    color: var(--clay); font-feature-settings: "tnum"; margin-left: 8px;
  }

  /* Stats */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 4px;
  }
  .stat-value {
    font-family: var(--font-serif);
    font-size: 30px; font-weight: 400;
    color: var(--accent-deep);
  }
  .stat-value.red { color: var(--red); }
  .stat-label { font-size: 12px; color: var(--text-muted); }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .full { grid-column: 1 / -1; }

  /* Cards */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-header {
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .card-header .icon {
    font-size: 16px; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); border-radius: var(--radius-sm);
  }
  .card-header h2 {
    font-family: var(--font-serif);
    font-size: 14px; font-weight: 400;
  }
  .card-header .badge {
    font-size: 11px; padding: 2px 9px; border-radius: 20px; font-weight: 500;
    margin-left: auto;
  }
  .badge-ok { background: var(--green-bg); color: var(--green); }
  .badge-warn { background: var(--amber-bg); color: var(--amber); }
  .badge-err { background: var(--red-bg); color: var(--red); }
  .card-body { padding: 14px 18px; }

  /* Project cards */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .proj-card {
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px;
    transition: all 0.15s;
    cursor: default;
    border: 1px solid transparent;
  }
  .proj-card:hover {
    background: var(--card-hover);
    border-color: var(--accent-light);
  }
  .proj-top {
    display: flex; align-items: flex-start; gap: 10px;
  }
  .proj-avatar {
    width: 36px; height: 36px; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .proj-info { flex: 1; min-width: 0; }
  .proj-name {
    font-size: 14px; font-weight: 600; color: var(--text);
    margin-bottom: 2px;
  }
  .proj-desc {
    font-size: 12px; color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .proj-meta {
    display: flex; gap: 10px; font-size: 11px; color: var(--text-light);
    margin-top: 4px;
  }
  .proj-meta span { display: flex; align-items: center; gap: 4px; }
  .proj-tags {
    display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px;
  }
  .proj-tag {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    background: var(--border); color: var(--clay);
  }
  .proj-tag.active { background: var(--green-bg); color: var(--green); }
  .proj-tag.error { background: var(--red-bg); color: var(--red); }
  .proj-status {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    font-weight: 500;
  }
  .status-live { background: var(--green-bg); color: var(--green); }
  .status-dev { background: var(--amber-bg); color: var(--amber); }
  .status-idle { background: var(--bg); color: var(--clay); }

  /* Obsidian tree */
  .vault-tree { display: flex; flex-direction: column; gap: 2px; }
  .vault-item {
    display: flex; align-items: center; gap: 7px; padding: 7px 10px;
    border-radius: var(--radius-sm); font-size: 13px; color: var(--text);
    cursor: default; transition: background 0.15s;
  }
  .vault-item:hover { background: var(--bg); }
  .vault-item.root {
    font-family: var(--font-serif); font-size: 14px;
    color: var(--accent-deep); font-weight: 600;
    background: var(--bg); margin-bottom: 4px;
  }
  .vault-item .count {
    margin-left: auto; font-size: 11px; color: var(--text-light);
  }
  .vault-indent { padding-left: 24px; }

  /* Cron list */
  .cron-section {
    font-size: 11px; font-weight: 600; color: var(--accent-deep);
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 10px 0 4px; opacity: 0.7;
  }
  .cron-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .cron-row:last-child { border-bottom: none; }
  .cron-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  }
  .cron-dot.ok { background: var(--green); }
  .cron-dot.err { background: var(--red); }
  .cron-dot.off { background: var(--clay-light); }
  .cron-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cron-time { font-size: 11px; color: var(--clay); white-space: nowrap; font-feature-settings: "tnum"; }
  .cron-model { font-size: 10px; color: var(--text-light); white-space: nowrap; }

  /* Footer */
  .footer {
    margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--text-light);
  }

  /* Scroll */
  .scroll-area { max-height: 400px; overflow-y: auto; }
  .scroll-area::-webkit-scrollbar { width: 4px; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Responsive */
  @media (max-width: 768px) {
    body { padding: 14px 12px 36px; }
    .header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .header-text h1 { font-size: 20px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-card { padding: 12px 14px; }
    .stat-value { font-size: 24px; }
    .grid { grid-template-columns: 1fr; }
    .projects-grid { grid-template-columns: 1fr; }
  }
  @media (min-width: 769px) and (max-width: 1024px) {
    .projects-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

// ── Render ──
function renderProjects() {
  const el = document.getElementById('projects-grid');
  el.innerHTML = PROJECTS.map(p => `
    <div class="proj-card">
      <div class="proj-top">
        <div class="proj-avatar" style="background:${p.color}20;color:${p.color}">${p.icon}</div>
        <div class="proj-info">
          <div class="proj-name">${p.name}</div>
          <div class="proj-desc">${p.desc}</div>
          <div class="proj-meta">
            <span>🧠 ${p.model}</span>
            <span class="proj-status ${p.status==='live'?'status-live':p.status==='dev'?'status-dev':'status-idle'}">${p.status==='live'?'运行中':p.status==='dev'?'开发中':'待机'}</span>
          </div>
        </div>
      </div>
      <div class="proj-tags">
        ${p.tags.map(t => `<span class="proj-tag active">${t}</span>`).join('')}
      </div>
    </div>
  `).join('');
}

function renderObsidian() {
  const el = document.getElementById('obsidian-body');
  let html = '<div class="vault-tree">';
  html += '<div class="vault-item root">🏠 数字第二大脑</div>';
  OBSIDIAN.forEach(f => {
    html += `<div class="vault-item ${f.indent?'vault-indent':''}">
      <span>${f.icon}</span> ${f.name}
      <span class="count">${f.count}</span>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

// ── Try loading injected or fetched live data ──
function renderCronList(jobs) {
  const el = document.getElementById('cron-list');
  if (!jobs || !jobs.length) {
    el.innerHTML = '<div style="padding:16px;color:var(--text-muted);font-size:13px">暂无实时数据</div>';
    return;
  }
  // Group by prefix
  const groups = {
    '🌅 早间推送': ['天气早报','生词','早高峰','美团'],
    '📈 市场 & 数据': ['市场监控','Au9999','负鼠','小米','股票日报'],
    '💪 生活 & 健康': ['健身','断舍离','英语打卡','会议预告','晚高峰','多邻国','健康数据','健康日报','网球'],
    '🗄️ 归档 & 同步': ['存档','豆瓣','对话沉淀','Obsidian 看板','对话日志'],
    '📋 周常复盘': ['学习报告','每周复盘','断舍离周报']
  };
  let html = '';
  for (const [section, keywords] of Object.entries(groups)) {
    const matches = jobs.filter(j => keywords.some(k => (j.name||'').includes(k)));
    if (!matches.length) continue;
    html += `<div class="cron-section">${section}</div>`;
    matches.forEach(j => {
      const statusClass = j.last_status==='ok'?'ok':j.last_status==='error'?'err':'off';
      const state = j.state==='paused' ? 'off' : statusClass;
      html += `<div class="cron-row">
        <span class="cron-dot ${state}"></span>
        <span class="cron-name">${j.name||j.id}</span>
        <span class="cron-time">${j.schedule||'—'}</span>
        <span class="cron-model">${j.mode||'LLM'}</span>
      </div>`;
    });
  }
  el.innerHTML = html || '<div style="padding:16px;color:var(--text-muted);font-size:13px">暂无数据</div>';
}

async function loadLiveData() {
  // 1) Try injected data (from refresh.py)
  if (typeof LIVE_DATA === 'object' && LIVE_DATA && LIVE_DATA.cron) {
    applyLiveData(LIVE_DATA);
    return;
  }
  // 2) Try fetch data.json (works on GitHub Pages)
  try {
    const resp = await fetch('data.json?t=' + Date.now());
    if (resp.ok) {
      const data = await resp.json();
      if (data.cron) { applyLiveData(data); return; }
    }
  } catch(e) {}
  // 3) Fallback — show time only
  const now = new Date().toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'});
  document.getElementById('update-time').textContent = now;
  document.getElementById('footer-time').textContent = '数据更新: ' + now;
  renderCronList([]);
}

function applyLiveData(data) {
  const c = data.cron || {};
  document.getElementById('update-time').textContent = data.updated || '';
  document.getElementById('footer-time').textContent = '数据更新: ' + (data.updated || '—');
  document.getElementById('cron-health-badge').textContent = `${c.ok||0}/${c.total||0}`;
  document.querySelectorAll('.stat-value')[1].textContent = c.total || '—';
  document.querySelectorAll('.stat-value')[2].textContent = c.ok || '—';
  document.querySelectorAll('.stat-value')[3].textContent = c.error || '0';
  if (c.jobs) renderCronList(c.jobs);
  const dot = document.querySelector('.header-right .dot');
  if (c.error > 0) { dot.className = 'dot err'; }
}
